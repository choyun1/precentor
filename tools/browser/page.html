<!doctype html>
<!-- Precentor. tools/browser.py makes site/index.html from this: style.css goes in at STYLE, the
     scripts in js/ (one shared scope, in the order of their numbers) at SCRIPT, the parish's plugins at PLUGINS. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precentor</title>
<!-- the icon: docs/brand/icon-small.svg (the full one, icon.svg, is for larger sizes), light or dark as the system is;
     tools/browser.py puts it in at ICON, percent-encoded (a bare # would end the address there and break the icon) -->
<link rel="icon" type="image/svg+xml" href="/*ICON*/">
<style>
/*STYLE*/
</style>
</head>
<body>
<header>
  <h1><a class="home" href="https://github.com/choyun1/precentor" target="_blank" rel="noopener" title="Precentor on GitHub"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22"/><g class="l" stroke-linecap="round" stroke-width="9"><line x1="22" x2="78" y1="34" y2="34"/><line x1="22" x2="70" y1="54" y2="54"/><line x1="22" x2="56" y1="74" y2="74"/></g><line class="p" x1="50" x2="50" y1="20" y2="46" stroke-width="7" stroke-linecap="round"/></svg>Precentor</a></h1>
  <nav>
    <button data-tab="upcoming" class="on">Coming up</button>
    <button data-tab="builder">Service planner</button>
    <button data-tab="texts">Psalms</button>
    <button data-tab="chants">Chants</button>
    <button data-tab="library">Music library</button>
    <button data-tab="history">History</button>
  </nav>
  <span id="savebar"></span><span id="gitbar"></span>
</header>
<main>
  <section id="tab-upcoming"></section>
  <section id="tab-builder" hidden></section>
  <section id="tab-chants" hidden></section>
  <section id="tab-texts" hidden></section>
  <section id="tab-library" hidden></section>
  <section id="tab-history" hidden></section>
</main>
<dialog id="dlg"><div id="dlgbody"></div><p><button class="small" onclick="dlg.close()">Close</button></p></dialog>
<script src="data.js"></script>
<script>
/*SCRIPT*/
</script>
<script>/*PLUGINS*/</script>
</body>
</html>
